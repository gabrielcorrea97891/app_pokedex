<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="list" class="ion-margin-end"></ion-icon>
      Todos Pokémon
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="pokedex-background">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Todos Pokémon</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col 
        size="6" 
        size-md="4" 
        size-lg="3" 
        *ngFor="let poke of pokemon"
        (click)="viewPokemonDetails(poke)"
      >
        <ion-card class="pokemon-card">
          <div class="pokemon-number">#{{ poke.pokeIndex | number: '3.0' }}</div>
          <div class="pokemon-image-container">
            <img 
              [src]="poke.image" 
              [alt]="poke.name"
              class="pokemon-image"
              loading="lazy"
            >
          </div>
          
          <ion-card-header>
            <ion-card-title class="pokemon-name">
              {{ poke.name | titlecase }}
            </ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-infinite-scroll (ionInfinite)="loadMore($event)" [disabled]="!hasMore">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Carregando Pokémon...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <div *ngIf="pokemon.length === 0 && !isLoading" class="empty-state">
    <ion-icon name="search-outline" class="empty-icon"></ion-icon>
    <p>No Pokémon found</p>
  </div>
</ion-content>
